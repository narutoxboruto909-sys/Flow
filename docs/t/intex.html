    <!-- Header Section -->

        <div onclick="openSubject('English')" class="cursor-pointer bg-slate-700/40 hover:bg-slate-700 p-6 rounded-2xl shadow-lg">

        <!-- Lesson View Section -->

            <button onclick="backToCategories()" class="mb-6 text-slate-300 hover:text-white">← Back to topics</button>

        </div>
    </section>

    <!-- Footer Section -->
    <footer class="p-6 text-center text-slate-400 bg-slate-800 mt-12">

    </footer>

      // Function to display subjects
      function openSubject(subject) {
          document.getElementById('subjects').classList.add('hidden');
          document.getElementById('subjectView').classList.remove('hidden');
          document.getElementById('lessonView').classList.add('hidden');
          document.getElementById('subjectTitle').innerText = subject;
          
          const list = document.getElementById('categoryList');
          list.innerHTML = ''; // Clear previous content
          
          Object.keys(data[subject]).forEach(category => {
              const div = document.createElement('div');
              div.className = 'cursor-pointer bg-slate-700/40 hover:bg-slate-700 p-6 rounded-2xl shadow-lg';
              div.innerHTML = `<h3 class="text-xl font-semibold">${category}</h3>`;
              div.onclick = () => openLessonList(subject, category);
              list.appendChild(div);
          });
      }
  
      // Function to open lesson topics under selected category
      function openLessonList(subject, category) {
          const content = data[subject][category];
          const lessonContent = document.getElementById('lessonContent');
          lessonContent.innerHTML = `<h3 class="text-2xl font-bold mb-6">${category}</h3>`;
          
          content.forEach(topic => addTopic(topic));
  
          document.getElementById('categoryList').classList.add('hidden');
          document.getElementById('lessonView').classList.remove('hidden');
      }
  
      // Function to add each topic under the selected category
      function addTopic(topic) {
          const lessonContent = document.getElementById('lessonContent');
          const div = document.createElement('div');
          div.className = 'mb-4 p-4 bg-slate-700/30 rounded-xl cursor-pointer hover:bg-slate-700';
          div.innerHTML = `
              <h4 class="text-lg font-semibold">${topic}</h4>
              <button class="mt-2 bg-indigo-600 px-4 py-2 rounded-lg" onclick="openLesson('${topic}')">Open Lesson</button>
          `;
          lessonContent.appendChild(div);
      }
  
      // Function to go back to the subject view
      function backToSubjects() {
          document.getElementById('subjectView').classList.add('hidden');
          document.getElementById('subjects').classList.remove('hidden');
      }
  
      // Function to go back to the category list
      function backToCategories() {
          document.getElementById('lessonView').classList.add('hidden');
          document.getElementById('categoryList').classList.remove('hidden');
      }
  
      // Open lesson details (video, notes, exercises)
      function openLesson(topic) {
          // Show the content dynamically based on the topic
          alert(`Opening content for: ${topic}`);
          // You can use modals, videos, notes, and exercises here.
      }
